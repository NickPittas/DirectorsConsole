[project]
name = "comfyui-orchestrator"
version = "0.1.0"
description = "ComfyUI orchestration desktop application"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7.0",
  "PyYAML>=6.0.1",
  "httpx>=0.27.0",
  "watchdog>=3.0.0",
  "aiosqlite>=0.19.0",
  "loguru>=0.7.2",
  "websockets>=12.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "Pillow>=10.0.0",
  "opencv-python>=4.8.0",
]

[project.optional-dependencies]
monitoring = [
  "aiohttp>=3.9.0",
  "psutil>=5.9.0",
  "pynvml>=11.5.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]
