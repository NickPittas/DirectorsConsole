[tool.poetry]
name = "cinema-prompt-engineering"
version = "0.1.0"
description = "Professional cinematography prompt generator for AI image/video models"
authors = ["Cinema Prompt Engineering Team"]
packages = [
    { include = "cinema_rules" },
    { include = "api" },
    { include = "templates_system" },
    { include = "workflow_parser" },
]
include = [
    { path = "templates_system/data/angles.txt", format = ["sdist", "wheel"] },
    { path = "templates_system/data/template_schema.json", format = ["sdist", "wheel"] },
    { path = "templates_system/templates/*.json", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.5.0"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
httpx = "^0.26.0"
aiohttp = "^3.9.0"
jsonschema = "^4.20.0"
requests = "^2.31.0"
python-multipart = ">=0.0.6"
python-dotenv = ">=1.0.0"
pillow = ">=10.0.0"
cryptography = ">=41.0.0"
loguru = ">=0.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.23.0"
ruff = "^0.1.0"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
